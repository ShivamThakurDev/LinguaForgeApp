name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore LinguaForge.API/LinguaForge.API.sln

      - name: Build
        run: dotnet build LinguaForge.API/LinguaForge.API.sln -c Release --no-restore

      - name: Test
        run: dotnet test LinguaForge.Tests/LinguaForge.Tests.csproj -c Release --verbosity normal

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production
